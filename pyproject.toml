[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-engineering-lab"
version = "0.1.0"
description = "Small defensive security engineering experiments and utilities."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3"
]

[project.scripts]
security-header-inspector = "security_engineering_lab.cli:main"
tls-certificate-inspector = "security_engineering_lab.tls_cli:main"
security-site-report = "security_engineering_lab.report_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
